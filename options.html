<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; min-width: 300px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, textarea { width: 100%; margin-top: 5px; padding: 8px; box-sizing: border-box;}
    textarea { height: 100px; }
    button { margin-top: 15px; padding: 10px 20px; background: #3b82f6; color: white; border: none; cursor: pointer; }
    #status { margin-top: 10px; color: green; font-size: 0.9em; }
  </style>
</head>
<body>
  <h2>Extension Settings</h2>
  
  <label>Claude API Key:</label>
  <input type="password" id="apiKey" placeholder="sk-ant-...">

  <label>System Prompt (Instructions for AI):</label>
  <textarea id="sysPrompt">You are a helpful assistant. Explain the selected text clearly and concisely.</textarea>

  <button id="save">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
